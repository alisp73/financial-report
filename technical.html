<style>
:root{
  --bg:#131722; --panel:#131722; --pop:#1e222d; --bd:#2a2e39; --bd2:#363a45;
  --ink:#d1d4dc; --ink2:#b2b5be; --muted:#787b86; --hover:#2a2e39;
  --accent:#2962ff; --accent-ink:#fff;
  --up:#26a69a; --dn:#ef5350; --gridc:#1f2430;
  --f:"Vazirmatn",Tahoma,sans-serif;
  --shadow:0 6px 24px rgba(0,0,0,.45);
}
html[data-theme="light"]{
  --bg:#fff; --panel:#fff; --pop:#fff; --bd:#e0e3eb; --bd2:#d1d4dc;
  --ink:#131722; --ink2:#131722; --muted:#787b86; --hover:#f0f3fa;
  --gridc:#eef1f7; --shadow:0 6px 24px rgba(19,23,34,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 var(--f);
  overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

.app{height:100vh;display:flex;flex-direction:column}

/* ---------- نوار بالا ---------- */
.topbar{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:2px;
  padding:0 8px;border-bottom:1px solid var(--bd);direction:rtl;
  background:var(--panel);white-space:nowrap;overflow-x:auto;overflow-y:hidden}
.topbar::-webkit-scrollbar{height:0}
.tb{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 9px;
  border-radius:5px;color:var(--ink);font-size:13px}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--hover)}
.tb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.tb b{font-weight:600}
.symbtn{font-weight:700;font-size:15px;padding-inline:10px}
.vr{width:1px;height:20px;background:var(--bd);margin:0 5px;flex:none}
.pick{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;
  border-radius:5px;font-size:12px;color:var(--muted)}
.pick:hover{background:var(--hover)}
.pick span{font-weight:500}
.pick select{height:24px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);
  border-radius:4px;font:inherit;font-size:12.5px;font-weight:600;padding:0 4px;
  cursor:pointer;outline:none}
.pick select:focus{border-color:var(--accent)}
.seg{display:inline-flex;border-radius:5px;overflow:hidden}
.seg button{height:30px;padding:0 10px;color:var(--muted);font-size:12px;font-weight:600}
.seg button:hover{background:var(--hover);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--accent)}
html[data-theme="light"] .seg button[aria-pressed="true"]{color:var(--accent)}
.grow{flex:1 1 auto}
.tag{font-size:11px;color:var(--muted);padding:0 8px}

/* ---------- بدنه ---------- */
.body{flex:1;display:flex;direction:ltr;min-height:0}
.charts{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.rail{width:44px;flex:none;border-left:1px solid var(--bd);background:var(--panel);
  display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:4px}
.rail button{width:32px;height:32px;border-radius:5px;display:grid;place-items:center;
  color:var(--muted)}
.rail button:hover{background:var(--hover);color:var(--ink)}
.rail button.on{background:var(--hover);color:var(--accent)}
.rail svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- نوار ابزار رسم ---------- */
.drawbar{width:40px;flex:none;border-right:1px solid var(--bd);background:var(--panel);
  display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:3px}
.drawbar button{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;
  color:var(--muted)}
.drawbar button:hover{background:var(--hover);color:var(--ink)}
.drawbar button.on{background:var(--hover);color:var(--accent)}
.drawbar svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.drawbar .sep{width:20px;height:1px;background:var(--bd);margin:4px 0}

/* لایه‌ی رسم روی نمودار اصلی. خودش کلیک نمی‌گیرد تا نمودار عادی
   جابه‌جا شود؛ فقط خودِ خط‌ها کلیک‌پذیرند. وقتی ابزاری فعال باشد
   کلاس draw-on می‌گیرد و کل لایه کلیک را می‌گیرد. */
.draw{position:absolute;inset:0;z-index:4;pointer-events:none;direction:ltr}
.draw.draw-on{pointer-events:auto;cursor:crosshair}
.draw path,.draw line{pointer-events:stroke;cursor:pointer}
.draw .hit{stroke:transparent;stroke-width:10}
.draw .sel{stroke-dasharray:5 3}
.draw circle{pointer-events:none}

/* ---------- پنل نمادها ---------- */
.side{width:286px;flex:none;border-left:1px solid var(--bd);background:var(--panel);
  display:flex;flex-direction:column;direction:rtl;min-height:0}
.side[hidden]{display:none}
.side h4{margin:0;padding:11px 12px 8px;font-size:12px;font-weight:700;color:var(--muted);
  letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center}
.side h4 span{font-weight:500;font-size:11px}
.srch{margin:0 10px 8px;position:relative}
.srch input{width:100%;height:32px;border-radius:5px;border:1px solid var(--bd);
  background:var(--bg);padding:0 30px 0 10px;font-size:12.5px;outline:none}
.srch input:focus{border-color:var(--accent)}
.srch svg{position:absolute;inset-inline-start:9px;top:8px;width:15px;height:15px;
  fill:none;stroke:var(--muted);stroke-width:1.8}
.wlhead{display:grid;grid-template-columns:1fr 78px 62px;gap:4px;padding:5px 12px;
  font-size:10.5px;color:var(--muted);border-bottom:1px solid var(--bd)}
.wl{flex:1;overflow:auto;min-height:0}
.wrow{display:grid;grid-template-columns:1fr 78px 62px;gap:4px;align-items:center;
  padding:6px 12px;cursor:pointer;border-bottom:1px solid transparent}
.wrow:hover{background:var(--hover)}
.wrow.on{background:var(--hover);box-shadow:inset 2px 0 0 var(--accent)}
.wrow .s{font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;min-width:0}
.wrow .g{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;display:block;font-weight:400}
.wrow .p{font-size:12px;text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
.wrow .c{font-size:11.5px;text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
.up{color:var(--up)} .dn{color:var(--dn)} .fl{color:var(--muted)}
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:12px}

/* ---------- پنجره‌ی داده ---------- */
.dw{padding:4px 12px 14px;overflow:auto;font-size:12px}
.dw .r{display:flex;justify-content:space-between;gap:10px;padding:4px 0;
  border-bottom:1px solid var(--bd)}
.dw .r b{font-weight:500;color:var(--muted)}
.dw .r span{font-variant-numeric:tabular-nums;direction:ltr}

/* ---------- پنل‌های نمودار ---------- */
.pane{position:relative;min-height:0;flex:none;height:132px}
.pane.main{flex:1 1 auto;min-height:200px;height:auto}
/* canvas جهتِ نوشتار را از عنصر می‌گیرد؛ اگر RTL بماند برچسبِ محور
   «500.0 م.ت» را «م.ت 500.0» می‌کشد. */
.pane .cv{position:absolute;inset:0;direction:ltr}
.pane+.pane{border-top:1px solid var(--bd)}
.grip{position:absolute;top:-3px;left:0;right:0;height:7px;cursor:row-resize;z-index:6}
.legend{position:absolute;top:7px;left:11px;z-index:5;direction:rtl;
  display:flex;flex-wrap:wrap;align-items:center;gap:4px 11px;
  font-size:12px;pointer-events:none;max-width:calc(100% - 110px)}
.legend .ttl{font-weight:700;font-size:13px;color:var(--ink)}
.legend .ttl em{font-style:normal;color:var(--muted);font-weight:500}
.legend i{font-style:normal;color:var(--muted)}
.legend b{font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.legend .pill{pointer-events:auto;display:inline-flex;align-items:center;gap:6px}
.legend .x{pointer-events:auto;width:16px;height:16px;border-radius:3px;color:var(--muted);
  display:none;place-items:center;font-size:14px;line-height:1}
.pane:hover .legend .x{display:grid}
.legend .x:hover{background:var(--hover);color:var(--ink)}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  font-size:56px;font-weight:800;color:var(--ink);opacity:.045;z-index:1}

/* ---------- نوار پایین ---------- */
.statusbar{height:29px;flex:0 0 29px;border-top:1px solid var(--bd);display:flex;
  align-items:center;gap:3px;padding:0 8px;direction:rtl;background:var(--panel);
  font-size:11.5px;color:var(--muted)}
.statusbar .seg button{height:22px;padding:0 8px;font-size:11px}

/* ---------- مودال ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none}
.ov.on{display:block}
.modal{position:absolute;top:9vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);
  max-height:78vh;background:var(--pop);border:1px solid var(--bd);border-radius:8px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;direction:rtl}
.modal header{display:flex;align-items:center;gap:8px;padding:12px 14px;
  border-bottom:1px solid var(--bd)}
.modal header b{flex:1;font-size:14px}
.modal header button{width:28px;height:28px;border-radius:5px;color:var(--muted);
  display:grid;place-items:center;font-size:18px}
.modal header button:hover{background:var(--hover);color:var(--ink)}
.modal .mbody{overflow:auto;padding:6px 0 10px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 15px;cursor:pointer}
.mrow:hover,.mrow.hot{background:var(--hover)}
.mrow .s{font-weight:700;min-width:74px}
.mrow .n{flex:1;color:var(--muted);font-size:12px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mrow .m{font-size:11px;color:var(--muted)}
.mrow.dis{opacity:.38;cursor:not-allowed}
.mrow .sw{width:20px;height:3px;border-radius:2px;flex:none}
.mrow .ck{width:16px;height:16px;border:1.5px solid var(--bd2);border-radius:3px;
  display:grid;place-items:center;font-size:11px;color:var(--accent-ink)}
.mrow.sel .ck{background:var(--accent);border-color:var(--accent)}
.gh{padding:11px 15px 5px;font-size:11px;color:var(--muted);font-weight:700}
.msearch{padding:10px 14px;border-bottom:1px solid var(--bd)}
.msearch input{width:100%;height:34px;border-radius:5px;border:1px solid var(--bd);
  background:var(--bg);padding:0 11px;outline:none;font-size:13px}
.msearch input:focus{border-color:var(--accent)}
.mafoot{padding:10px 14px;border-top:1px solid var(--bd)}
.addma{height:32px;padding:0 14px;border-radius:6px;background:var(--accent);
  color:#fff;font:inherit;font-weight:600;font-size:12.5px;cursor:pointer}
.marow{display:flex;align-items:center;gap:8px;padding:8px 15px}
.marow input[type=number]{width:62px;height:28px;border-radius:5px;border:1px solid var(--bd);
  background:var(--bg);color:var(--ink);font:inherit;text-align:center}
.marow select{height:28px;border-radius:5px;border:1px solid var(--bd);
  background:var(--bg);color:var(--ink);font:inherit}
.marow input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--bd);
  border-radius:5px;background:var(--bg);cursor:pointer}
.marow .lbl{color:var(--muted);font-size:12px}
.marow .rm{margin-inline-start:auto;width:26px;height:26px;border-radius:5px;
  color:var(--muted);display:grid;place-items:center;font-size:16px}
.marow .rm:hover{background:var(--hover);color:var(--dn)}

.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:8;
  background:var(--bg);color:var(--muted);font-size:13px}
.loading[hidden]{display:none}
@media (max-width:900px){ .side{width:230px} .rail{width:38px} }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <button class="tb symbtn" id="symBtn" title="جست‌وجوی نماد">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span id="symBtnText">—</span>
    </button>
    <span class="vr"></span>

    <label class="pick"><span>بازه</span>
      <select id="tfPick" aria-label="بازه‌ی زمانی">
        <option value="D">روزانه</option>
        <option value="W">هفتگی</option>
        <option value="M">ماهانه</option>
      </select>
    </label>

    <label class="pick"><span>نوع</span>
      <select id="typePick" aria-label="نوع نمودار">
        <option value="candle">شمعی</option>
        <option value="bar">میله‌ای</option>
        <option value="line">خطی</option>
        <option value="area">کوهستانی</option>
      </select>
    </label>
    <span class="vr"></span>

    <button class="tb" id="indBtn">
      <svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 15l3.5-4 3 2.5L20 7"/></svg>
      <span>اندیکاتورها</span>
    </button>
    <span class="vr"></span>

    <label class="pick"><span>قیمت</span>
      <select id="adjPick" aria-label="تعدیل قیمت">
        <option value="1">تعدیل‌شده</option>
        <option value="0">تعدیل‌نشده</option>
      </select>
    </label>
    <button class="tb on" id="evBtn" title="نمایش سود نقدی و افزایش سرمایه">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
      <span>رویدادها</span>
    </button>
    <button class="tb" id="usdBtn" title="قیمت دلاری (تعدیل‌شده ÷ نرخ دلار همان روز) — محور سمت چپ">
      <svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M16 7.5c0-1.7-1.8-2.5-4-2.5s-4 .8-4 2.5S9.8 10 12 10s4 .9 4 2.6-1.8 2.6-4 2.6-4-.9-4-2.6"/></svg>
      <span>دلاری</span>
    </button>

    <span class="grow"></span>
    <span class="tag" id="metaTag"></span>
    <button class="tb" id="themeBtn" title="پوسته">
      <svg viewBox="0 0 24 24"><path d="M20 13.5A8 8 0 0 1 10.5 4a8 8 0 1 0 9.5 9.5z"/></svg>
    </button>
    <a class="tb" href="product_sales.html" title="بازگشت به داشبورد">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>داشبورد</span>
    </a>
  </div>

  <div class="body">
    <aside class="drawbar" id="drawBar" aria-label="ابزار رسم"></aside>

    <div class="charts" id="charts">
      <div class="loading" id="loading">در حال بارگذاری داده…</div>
    </div>

    <aside class="side" id="sideWatch">
      <h4>فهرست نمادها <span id="wlCount"></span></h4>
      <div class="srch">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="wlSearch" type="search" placeholder="جست‌وجوی نماد، شرکت یا صنعت…" autocomplete="off">
      </div>
      <div class="wlhead"><span>نماد</span><span style="text-align:left">آخرین</span><span style="text-align:left">تغییر</span></div>
      <div class="wl" id="wlBody"></div>
    </aside>

    <aside class="side" id="sideData" hidden>
      <h4>پنجره‌ی داده</h4>
      <div class="dw" id="dwBody"></div>
    </aside>

    <div class="rail">
      <button id="railWatch" class="on" title="فهرست نمادها">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <button id="railData" title="پنجره‌ی داده">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 10v10"/></svg>
      </button>
      <button id="railInd" title="اندیکاتورها">
        <svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 15l3.5-4 3 2.5L20 7"/></svg>
      </button>
    </div>
  </div>

  <div class="statusbar">
    <div class="seg" id="rangeSeg">
      <button data-r="60">۳ ماه</button>
      <button data-r="125">۶ ماه</button>
      <button data-r="250">۱ سال</button>
      <button data-r="750">۳ سال</button>
      <button data-r="1250">۵ سال</button>
      <button data-r="0" aria-pressed="true">همه</button>
    </div>
    <span class="vr"></span>
    <div class="seg" id="scaleSeg" role="group" aria-label="مقیاس قیمت">
      <button data-log="0" aria-pressed="true">خطی</button>
      <button data-log="1" aria-pressed="false">لگاریتمی</button>
    </div>
    <span class="grow"></span>
    <span id="statusText"></span>
  </div>
</div>

<div class="ov" id="symOv">
  <div class="modal" role="dialog" aria-label="جست‌وجوی نماد">
    <header><b>جست‌وجوی نماد</b><button data-close="symOv" aria-label="بستن">×</button></header>
    <div class="msearch"><input id="symSearch" type="search" placeholder="نام نماد یا شرکت…" autocomplete="off"></div>
    <div class="mbody" id="symList"></div>
  </div>
</div>

<div class="ov" id="maOv">
  <div class="modal" role="dialog" aria-label="تنظیم میانگین متحرک" style="width:min(460px,94vw)">
    <header><b>میانگین متحرک</b><button data-close="maOv" aria-label="بستن">×</button></header>
    <div class="mbody" id="maBody"></div>
    <div class="mafoot">
      <button class="addma" id="maAdd" type="button">+ افزودن میانگین</button>
    </div>
  </div>
</div>

<div class="ov" id="indOv">
  <div class="modal" role="dialog" aria-label="اندیکاتورها">
    <header><b>اندیکاتورها</b><button data-close="indOv" aria-label="بستن">×</button></header>
    <div class="msearch"><input id="indSearch" type="search" placeholder="نام اندیکاتور…" autocomplete="off"></div>
    <div class="mbody" id="indList"></div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   داده — هر نماد یک فایل js جدا. با <script src> خوانده می‌شود تا روی
   file:// هم کار کند (fetch روی file:// بلاک است).
   ===================================================================== */
const DEFAULT_KEY = "s0496";
const DATA_DIR    = "technical_data/";
/* شناسه‌ی هر بار ساختن صفحه. به آدرس فایل‌های داده چسبانده می‌شود تا مرورگر
   نسخه‌ی کش‌شده‌ی دیروز را نشان ندهد — نام فایل‌ها (s0496.js …) هر روز
   ثابت است و بدون این، به‌خصوص وقتی صفحه از server.py باز می‌شود، نمودار
   با داده‌ی قدیمی باز می‌شد. */
const BUILD_ID    = "20260922181502";
const DAY = 86400;

const TECH = (function(){
  const raw = {}, done = {}, waiting = {};
  let indexRows = null, onIndex = null;
  return {
    put(key, payload){
      raw[key] = payload;
      const list = waiting[key]; delete waiting[key];
      if(list) list.forEach(fn => fn(get(key)));
    },
    index(rows){ indexRows = rows; if(onIndex) onIndex(rows); },
    rows(){ return indexRows; },
    whenIndex(fn){ if(indexRows) fn(indexRows); else onIndex = fn; },
    load(key, fn){
      if(done[key]) return fn(done[key]);
      if(raw[key])  return fn(get(key));
      if(waiting[key]){ waiting[key].push(fn); return; }
      waiting[key] = [fn];
      const el = document.createElement('script');
      el.src = DATA_DIR + key + '.js?v=' + BUILD_ID;
      el.onerror = () => {
        const list = waiting[key]; delete waiting[key];
        if(list) list.forEach(f => f(null));
      };
      document.head.appendChild(el);
    }
  };
  function get(key){
    if(!done[key]) done[key] = decode(raw[key]);
    return done[key];
  }
})();

function expandRle(rle, n){
  const out = new Array(n).fill(null);
  if(!rle || !rle.length) return out;
  let j = 0, v = null;
  for(let i=0;i<n;i++){
    while(j < rle.length && rle[j][0] === i){ v = rle[j][1]; j++; }
    out[i] = v;
  }
  return out;
}

function decode(p){
  if(!p) return null;
  const n = p.d.length, t = new Array(n);
  let day = 0;
  for(let i=0;i<n;i++){ day += p.d[i]; t[i] = day * DAY; }

  const d = {
    sym:p.s, name:p.n||'', ind:p.g||'', market:p.mk||'', board:p.bd||'',
    n:n, t:t,
    o:p.o||null, h:p.h||null, l:p.l||null, c:p.c||null,
    w:p.w||null, pw:p.pw||null,
    v:p.v||null, q:p.q||null, nt:p.nt||null, rv:p.rv||null,
    pe:p.pe||null, ps:p.ps||null, pb:p.pb||null, pd:p.pd||null,
    pn:p.pn||null, nv:p.nv||null,
    bp:p.bp||null, ni:p.ni||null, rn:p.rn||null, pp:p.pp||null, pq:p.pq||null,
    k:expandRle(p.k, n), sh:expandRle(p.sh, n), ff:expandRle(p.ff, n),
    /* داده‌ی بنیادی: ماهانه (تولید و فروش) و دوره‌ای (نسبت‌های مالی) */
    fm:p.fm || null, fr:p.fr || null
  };

  // ارزش بازار = قیمت پایانی × تعداد سهام؛ استثناها جدا ذخیره شده‌اند.
  if(p.m){
    d.m = p.m;
  }else{
    const m = new Array(n).fill(null);
    for(let i=0;i<n;i++){
      const w = d.w ? d.w[i] : null, s = d.sh[i];
      if(w != null && s != null) m[i] = w * s / 1e6;
    }
    (p.mx||[]).forEach(function(x){ m[x[0]] = x[1]; });
    d.m = m;
  }

  // درصد سهام شناور برای نمایش
  d.ffp = d.ff.map(x => x == null ? null : x * 100);

  // رویدادها: هرجا ضریب تعدیل عوض شد. اگر تعداد سهام هم عوض شده بود،
  // افزایش سرمایه است؛ وگرنه سود نقدی.
  const ev = [];
  for(let i=1;i<n;i++){
    if(d.k[i] !== d.k[i-1]){
      const cap = d.sh[i] !== d.sh[i-1];
      ev.push({i:i, t:t[i], type:cap?'C':'D'});
    }
  }
  d.events = ev;
  return d;
}

/* =====================================================================
   قالب‌بندی عدد و تاریخ
   ===================================================================== */
const NF = new Intl.NumberFormat('en-US');
function num(x, dec){
  if(x == null || !isFinite(x)) return '—';
  return x.toLocaleString('en-US',{minimumFractionDigits:dec||0, maximumFractionDigits:dec==null?0:dec});
}
function compact(x){
  if(x == null || !isFinite(x)) return '—';
  const a = Math.abs(x), s = x < 0 ? '-' : '';
  if(a >= 1e9) return s + (a/1e9).toFixed(3).replace(/\.?0+$/,'') + 'B';
  if(a >= 1e6) return s + (a/1e6).toFixed(3).replace(/\.?0+$/,'') + 'M';
  if(a >= 1e3) return s + (a/1e3).toFixed(2).replace(/\.?0+$/,'') + 'K';
  return s + a.toFixed(a < 10 ? 2 : 0).replace(/\.?0+$/,'');
}
/* عدد ورودی «میلیون ریال» است؛ خروجی همیشه میلیارد تومان — و برای
   عددهای خیلی بزرگ، همت. یک واحد ثابت تا مقایسه‌ی چشمی ممکن بماند. */
function money(x){
  if(x == null || !isFinite(x)) return '—';
  if(x === 0) return '0';
  const bt = x / 1e4;
  const a = Math.abs(bt);
  if(a >= 1000) return (bt/1000).toFixed(2) + ' همت';
  if(a >= 10)   return bt.toFixed(1) + ' م.ت';
  if(a >= 1)    return bt.toFixed(2) + ' م.ت';
  return bt.toFixed(3) + ' م.ت';
}
function pct(x, dec){
  if(x == null || !isFinite(x)) return '—';
  return (x>0?'+':'') + x.toFixed(dec==null?2:dec) + '%';
}

const JCACHE = new Map();
const JFMT = new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',
  {year:'numeric', month:'numeric', day:'numeric'});
const JLONG = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',
  {weekday:'long', year:'numeric', month:'long', day:'numeric'});
const JMONTH = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور',
                'مهر','آبان','آذر','دی','بهمن','اسفند'];

function jalali(ts){
  let j = JCACHE.get(ts);
  if(j) return j;
  const parts = JFMT.formatToParts(new Date(ts*1000));
  const o = {};
  parts.forEach(p => { if(p.type!=='literal') o[p.type] = parseInt(p.value,10); });
  j = {y:o.year, m:o.month, d:o.day};
  JCACHE.set(ts, j);
  return j;
}
function jalaliLong(ts){ return JLONG.format(new Date(ts*1000)); }
function jalaliShort(ts){
  const j = jalali(ts);
  return j.y + '/' + String(j.m).padStart(2,'0') + '/' + String(j.d).padStart(2,'0');
}
function tickMark(time, type){
  const j = jalali(time);
  if(type === 0) return String(j.y);
  if(type === 1) return j.m === 1 ? String(j.y) : JMONTH[j.m-1];
  return String(j.d);
}

/* =====================================================================
   اندیکاتورها
   ===================================================================== */

/* =====================================================================
   ریاضیاتِ اندیکاتورهای تکنیکال
   همه روی «میله‌ها» حساب می‌شوند نه داده‌ی خام، پس در حالت هفتگی و
   ماهانه هم درست‌اند.
   ===================================================================== */
function smaSeries(bars, len){
  const out = [], q = [];
  let sum = 0;
  for(const b of bars){
    q.push(b.c); sum += b.c;
    if(q.length > len) sum -= q.shift();
    if(q.length === len) out.push({time:b.t, value:sum/len});
  }
  return out;
}

/* EMA روی آرایه‌ای که ممکن است اولش خالی باشد؛ از اولین مقدار معتبر
   شروع می‌کند. */
function emaArray(values, len){
  const k = 2/(len+1), out = new Array(values.length).fill(null);
  let prev = null;
  for(let i=0;i<values.length;i++){
    const v = values[i];
    if(v == null) continue;
    prev = prev == null ? v : (v - prev)*k + prev;
    out[i] = prev;
  }
  return out;
}

function emaSeries(bars, len){
  const vals = emaArray(bars.map(b=>b.c), len);
  const out = [];
  bars.forEach((b,i)=>{ if(vals[i]!=null && i>=len-1) out.push({time:b.t, value:vals[i]}); });
  return out;
}

/* RSI با هموارسازی وایلدر — همان چیزی که TradingView می‌کشد. */
function rsiSeries(bars, len){
  if(bars.length <= len) return [];
  const out = [];
  let gain = 0, loss = 0;
  for(let i=1;i<=len;i++){
    const ch = bars[i].c - bars[i-1].c;
    if(ch >= 0) gain += ch; else loss -= ch;
  }
  gain /= len; loss /= len;
  const push = (b)=>{
    const rs = loss === 0 ? null : gain/loss;
    out.push({time:b.t, value: rs === null ? 100 : 100 - 100/(1+rs)});
  };
  push(bars[len]);
  for(let i=len+1;i<bars.length;i++){
    const ch = bars[i].c - bars[i-1].c;
    gain = (gain*(len-1) + Math.max(ch,0))/len;
    loss = (loss*(len-1) + Math.max(-ch,0))/len;
    push(bars[i]);
  }
  return out;
}

function macdSeries(bars, fast, slow, signal){
  const close = bars.map(b=>b.c);
  const ef = emaArray(close, fast), es = emaArray(close, slow);
  const line = close.map((_,i)=> (ef[i]!=null && es[i]!=null && i>=slow-1) ? ef[i]-es[i] : null);
  const sig = emaArray(line, signal);
  const out = {macd:[], signal:[], hist:[]};
  bars.forEach((b,i)=>{
    if(line[i] == null) return;
    out.macd.push({time:b.t, value:line[i]});
    if(sig[i] != null){
      out.signal.push({time:b.t, value:sig[i]});
      out.hist.push({time:b.t, value:line[i]-sig[i]});
    }
  });
  return out;
}

/* داده‌ی ماهانه و فصلی روی روزهای معاملاتی پخش می‌شود: هر میله آخرین
   عددی را می‌گیرد که تا آن روز منتشر شده. به این ترتیب همان داده روی
   شمع روزانه، هفتگی و ماهانه یکسان و بدون پرش نشان داده می‌شود. */
function stepSeries(bars, points, scale){
  if(!points || !points.length) return null;
  const k = scale || 1;
  const out = [];
  let j = 0, cur = null;
  for(const b of bars){
    while(j < points.length && points[j][0] <= b.t){ cur = points[j][1]; j++; }
    if(cur != null) out.push({time:b.t, value:cur * k});
  }
  return out;
}

/* سری پله‌ای تقسیم بر یک ستون روزانه — مثل «فروش ماهانه ÷ ارزش بازار».
   مخرج هر روز عوض می‌شود، پس نتیجه بین دو گزارش هم حرکت می‌کند. */
function stepDivSeries(bars, points, den, scale){
  const base = stepSeries(bars, points);
  if(!base || !den) return null;
  const at = new Map();
  bars.forEach(b => at.set(b.t, b.i));
  const k = scale || 1;
  const out = [];
  for(const p of base){
    const i = at.get(p.time);
    const q = (i == null) ? null : den[i];
    if(q) out.push({time:p.time, value:p.value / q * k});
  }
  return out.length ? out : null;
}

/* [[شماره‌ی روز, مقدار]] → [[ثانیه, مقدار]] */
function dayPoints(raw){
  if(!raw || !raw.length) return null;
  return raw.map(x => [x[0] * DAY, x[1]]);
}

/* نقطه‌های یک نسبت مالی برای نماد جاری */
function ratioPoints(d, index){
  const fr = d && d.fr;
  const col = fr && fr.v ? fr.v[index] : null;
  if(!col) return null;
  const out = [];
  for(let i = 0; i < fr.t.length; i++){
    if(col[i] != null) out.push([fr.t[i] * DAY, col[i]]);
  }
  return out.length ? out : null;
}

/* نرخ دلارِ همان روز (آخرین نرخ اعلام‌شده تا آن روز) */
const USD_POINTS = (USD_RATES || []).map(x => [x[0] * DAY, x[1]]);
function usdAt(time){
  let lo = 0, hi = USD_POINTS.length - 1, ans = null;
  while(lo <= hi){
    const mid = (lo + hi) >> 1;
    if(USD_POINTS[mid][0] <= time){ ans = USD_POINTS[mid][1]; lo = mid + 1; }
    else hi = mid - 1;
  }
  return ans;
}

function fmtBy(kind, x){
  if(x == null || !isFinite(x)) return '—';
  switch(kind){
    case 'compact': return compact(x);
    case 'money':   return money(x);
    case 'pct3':    return (Math.abs(x) >= 10 ? x.toFixed(1)
                          : Math.abs(x) >= 1 ? x.toFixed(2) : x.toFixed(3)) + '%';
    case 'pct2':    return (x>0?'+':'') + x.toFixed(2) + '%';
    case 'pct1':    return x.toFixed(1) + '%';
    case 'r2':      return x.toFixed(2);
    /* قیمت دلاری هر سهم عدد کوچکی است؛ با دو رقم اعشار همه‌شان صفر می‌شوند. */
    case 'usd':     return Math.abs(x) >= 100 ? x.toFixed(1)
                         : Math.abs(x) >= 1   ? x.toFixed(3)
                         : Math.abs(x) >= 0.01 ? x.toFixed(4) : x.toFixed(6);
    case 'int':     return num(Math.round(x));
    default:        return num(x, 2);
  }
}

      });
      S.inds = S.inds.filter(x => !/^e?ma\d+$/.test(x));
      if(S.inds.indexOf('ma') === -1) S.inds.push('ma');
      store('tv-inds', JSON.stringify(S.inds));
      store('tv-mas2', JSON.stringify(S.mas));
    }
  }catch(e){}
  S.range = parseInt(recall('tv-range','0'),10) || 0;
  S.log = recall('tv-log','0') === '1';
})();

/* =====================================================================
   تجمیع بازه‌ی زمانی
   ===================================================================== */
function buildBars(d){
  const n = d.n, adj = S.adj === 1;
  const px = key => {
    const a = d[key];
    if(!a) return null;
    if(!adj) return a;
    return a.map((x,i) => (x==null || d.k[i]==null) ? x : x * d.k[i]);
  };
  const o = px('o'), h = px('h'), l = px('l'), c = px('c'), w = px('w');

  // روزهایی که اصلاً معامله نشده‌اند (حجم صفر و بدون قیمت) شمع ندارند و
  // مثل TradingView از محور حذف می‌شوند، نه اینکه شمع تخت ساختگی بگیرند.
  const rows = [];
  for(let i=0;i<n;i++){
    let O=o&&o[i], H=h&&h[i], L=l&&l[i], C=c&&c[i];
    const W = w && w[i];
    if(C == null){
      const vol = d.v ? d.v[i] : null;
      if(!vol || W == null) continue;
      O=H=L=C=W;
    }
    if(O == null) O = C;
    if(H == null) H = Math.max(O,C);
    if(L == null) L = Math.min(O,C);
    rows.push({i:i, t:d.t[i], o:O, h:H, l:L, c:C, w:(W==null?C:W)});
  }
  if(S.tf === 'D') return rows;

  const out = [], seen = {};
  let cur = null, tag = null;
  for(const r of rows){
    const j = jalali(r.t);
    // هفته‌ی بورس ایران شنبه شروع می‌شود. روز صفرِ یونیکس پنج‌شنبه است،
    // پس با +۵ مرزِ هفته روی شنبه می‌افتد.
    const key = S.tf === 'M' ? (j.y*100 + j.m)
                             : Math.floor((r.t/DAY + 5) / 7);
    if(key !== tag){
      if(cur) out.push(cur);
      tag = key;
      cur = {i:r.i, t:r.t, o:r.o, h:r.h, l:r.l, c:r.c, w:r.w, ii:[r.i]};
    }else{
      cur.h = Math.max(cur.h, r.h); cur.l = Math.min(cur.l, r.l);
      cur.c = r.c; cur.w = r.w; cur.i = r.i; cur.ii.push(r.i);
    }
  }
  if(cur) out.push(cur);
  return out;
}

/* هر سری باید برای «همه‌ی» میله‌ها نقطه داشته باشد؛ جایی که مقدار
   ندارد، نقطه‌ی خالی (whitespace) می‌گیرد.

   چرا مهم است: پنل‌ها با «شماره‌ی منطقی» با هم همگام می‌شوند، نه با
   زمان. اگر سری اندیکاتور ۴۰۰ نقطه داشته باشد و نمودار قیمت ۴۶۰۰ تا،
   شماره‌ی ۱۰۰ در این دو به دو زمان کاملاً متفاوت اشاره می‌کند و پنل‌ها
   زیر هم نمی‌افتند — همان چیزی که در تصویر دیده می‌شد. */
function padSeries(bars, points){
  const map = new Map();
  (points || []).forEach(p => map.set(p.time, p));
  return bars.map(b => map.has(b.t) ? map.get(b.t) : {time:b.t});
}

function seriesFor(getter, bars, d, mode){
  const a = getter(d);
  if(!a) return null;
  const out = [];
  for(const b of bars){
    let v;
    if(b.ii && b.ii.length > 1 && mode === 'sum'){
      v = 0; let any = false;
      for(const i of b.ii){ if(a[i] != null){ v += a[i]; any = true; } }
      if(!any) v = null;
    }else{
      v = a[b.i];
    }
    if(v != null && isFinite(v)) out.push({time:b.t, value:v});
  }
  return out;
}

/* =====================================================================
   نمودارها
   ===================================================================== */
const LWC = LightweightCharts;
const charts = [];          // {id, chart, el, series, ind, legend}
let mainChart = null, mainSeries = null, volSeries = null;
const overlays = {};
let syncing = false;

function css(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function theme(){
  return {
    bg:css('--bg'), grid:css('--gridc'), border:css('--bd'),
    text:css('--muted'), up:css('--up'), dn:css('--dn'),
    ink:css('--ink'), pop:css('--pop')
  };
}
function baseOptions(){
  const T = theme();
  return {
    layout:{ background:{type:'solid', color:T.bg}, textColor:T.text,
             fontFamily:'Vazirmatn, Tahoma, sans-serif', fontSize:11,
             attributionLogo:false },
    grid:{ vertLines:{color:T.grid}, horzLines:{color:T.grid} },
    crosshair:{ mode: LWC.CrosshairMode.Normal,
      vertLine:{color:'#758696', width:1, style:2, labelBackgroundColor:T.pop},
      horzLine:{color:'#758696', width:1, style:2, labelBackgroundColor:T.pop} },
    rightPriceScale:{ borderColor:T.border, borderVisible:true, minimumWidth:78,
      scaleMargins:{top:0.1, bottom:0.1} },
    leftPriceScale:{ visible:false },
    timeScale:{ borderColor:T.border, rightOffset:5, barSpacing:7,
      minBarSpacing:0.3, timeVisible:false, secondsVisible:false,
      tickMarkFormatter:(t,type) => tickMark(t,type) },
    localization:{ locale:'fa-IR', dateFormat:'yyyy/MM/dd',
      // فقط تاریخ عددی: نامِ روز و ماه داخل canvas با ارقام لاتین
      // جابه‌جا رندر می‌شود و «شنبه ۳۱ مرداد» به هم می‌ریزد.
      timeFormatter:(t) => jalaliShort(t) },
    handleScroll:{ mouseWheel:true, pressedMouseMove:true, horzTouchDrag:true, vertTouchDrag:false },
    handleScale:{ axisPressedMouseMove:{time:true, price:true}, mouseWheel:true, pinch:true },
    autoSize:true
  };
}

function clearCharts(){
  charts.forEach(c => { try{ c.chart.remove(); }catch(e){} });
  charts.length = 0;
  Object.keys(overlays).forEach(k => delete overlays[k]);
  mainChart = mainSeries = volSeries = null;
  document.getElementById('charts').innerHTML =
    '<div class="loading" id="loading" hidden></div>';
}

function makePane(cls, height){
  const holder = document.getElementById('charts');
  const el = document.createElement('div');
  el.className = 'pane ' + cls;
  if(height) el.style.height = height + 'px';
  el.innerHTML = '<div class="legend"></div><div class="cv"></div>';
  holder.appendChild(el);
  return el;
}

function renderAll(){
  const d = S.data;

  /* بازه‌ی دید (زوم و اسکرول) قبل از بازسازی برداشته می‌شود و بعدش
     برمی‌گردد. بدون این، هر بار که اندیکاتوری اضافه/کم می‌کنی یا پوسته
     را عوض می‌کنی، نمودار به حالت اولیه می‌پرد. فقط وقتی نماد عوض شده
     باشد عمداً به بازه‌ی پیش‌فرض برمی‌گردیم. */
  const sameSymbol = S.shown === S.key;
  let keepRange = null;
  if(sameSymbol && charts.length){
    try{ keepRange = charts[0].chart.timeScale().getVisibleLogicalRange(); }catch(e){}
  }

  clearCharts();
  if(!d) return;

  const bars = S.bars = buildBars(d);
  const T = theme();
  BAR_INDEX.clear();
  bars.forEach((b,i) => BAR_INDEX.set(b.t, i));
  if(!bars.length){
    const l = document.getElementById('loading');
    if(l){ l.hidden = false; l.textContent = 'برای این نماد قیمتی ثبت نشده است.'; }
    return;
  }

  /* ---------- پنل اصلی ---------- */
  const mainEl = makePane('main');
  const wm = document.createElement('div');
  wm.className = 'wm';
  wm.textContent = d.sym;
  mainEl.insertBefore(wm, mainEl.firstChild);

  mainChart = LWC.createChart(mainEl.querySelector('.cv'), baseOptions());
  mainChart.priceScale('right').applyOptions({scaleMargins:{top:0.08, bottom:0.24}});

  const candles = bars.map(b => ({time:b.t, open:b.o, high:b.h, low:b.l, close:b.c}));
  if(S.type === 'candle'){
    mainSeries = mainChart.addCandlestickSeries({
      upColor:T.up, downColor:T.dn, borderUpColor:T.up, borderDownColor:T.dn,
      wickUpColor:T.up, wickDownColor:T.dn, priceLineWidth:1
    });
    mainSeries.setData(candles);
  }else if(S.type === 'bar'){
    mainSeries = mainChart.addBarSeries({upColor:T.up, downColor:T.dn, thinBars:false});
    mainSeries.setData(candles);
  }else if(S.type === 'area'){
    mainSeries = mainChart.addAreaSeries({
      lineColor:'#2962ff', topColor:'rgba(41,98,255,.28)', bottomColor:'rgba(41,98,255,0)',
      lineWidth:2 });
    mainSeries.setData(bars.map(b => ({time:b.t, value:b.c})));
  }else{
    mainSeries = mainChart.addLineSeries({color:'#2962ff', lineWidth:2});
    mainSeries.setData(bars.map(b => ({time:b.t, value:b.c})));
  }
  const lastPrice = bars[bars.length-1].c;
  const prec = lastPrice >= 1000 ? 0 : (lastPrice >= 10 ? 1 : 3);
  mainSeries.applyOptions({priceFormat:{type:'price', precision:prec,
    minMove: prec === 0 ? 1 : Math.pow(10, -prec)}});
  mainChart.priceScale('right').applyOptions({
    mode: S.log ? LWC.PriceScaleMode.Logarithmic : LWC.PriceScaleMode.Normal});

  /* حجم، پایینِ همان پنل — دقیقاً مثل TradingView. اگر از فهرست
     اندیکاتورها خاموشش کنی، فقط همین‌جا برداشته می‌شود؛ هیچ‌وقت
     زیرپنل جدا نمی‌سازد. */
  const vol = S.inds.indexOf('volume') === -1
    ? null : seriesFor(x => x.v, bars, d, 'sum');
  if(vol && vol.length){
    volSeries = mainChart.addHistogramSeries({
      priceFormat:{type:'volume'}, priceScaleId:'', color:T.up,
      lastValueVisible:false, priceLineVisible:false });
    volSeries.priceScale().applyOptions({scaleMargins:{top:0.82, bottom:0}});
    volSeries.setData(padSeries(bars, vol.map(p => ({
      time:p.time, value:p.value,
      color: barUpAt(bars, p.time) ? withAlpha(T.up,.55) : withAlpha(T.dn,.55)
    }))));
  }

  /* قیمت دلاری: همیشه از قیمتِ تعدیل‌شده ساخته می‌شود، حتی وقتی نمودار
     روی «تعدیل‌نشده» است — وگرنه هر سود نقدی یک پرش ساختگی در نمودار
     دلاری می‌سازد. محورش سمت چپ می‌نشیند تا با مقیاس ریالی قاطی نشود. */
  if(S.usd && USD_POINTS.length){
    const pts = [];
    for(const b of bars){
      const rate = usdAt(b.t);
      if(!rate) continue;
      const k = (S.adj === 1) ? 1 : (d.k[b.i] || 1);
      pts.push({time:b.t, value:b.c * k / rate});
    }
    if(pts.length){
      mainChart.applyOptions({leftPriceScale:{
        visible:true, borderColor:T.border, borderVisible:true, minimumWidth:78,
        scaleMargins:{top:0.08, bottom:0.24}}});
      const us = mainChart.addLineSeries({
        color:'#ffa726', lineWidth:1.8, priceScaleId:'left',
        priceLineVisible:false, crosshairMarkerVisible:true,
        priceFormat:{type:'custom', formatter:v => fmtBy('usd', v), minMove:0.000001},
        /* قیمت منفی وجود ندارد؛ بدون این، محور چپ چند برچسب منفی می‌گیرد. */
        autoscaleInfoProvider: original => {
          const info = original();
          if(info && info.priceRange && info.priceRange.minValue < 0) info.priceRange.minValue = 0;
          return info;
        }});
      us.setData(padSeries(bars, pts));
      mainChart.priceScale('left').applyOptions({
        mode: S.log ? LWC.PriceScaleMode.Logarithmic : LWC.PriceScaleMode.Normal});
      const map = new Map();
      pts.forEach(x => map.set(x.time, x.value));
      overlays['usdprice'] = {series:us, map:map,
        def:{color:'#ffa726', tag:'دلاری', fmt:'usd'}};
    }
  }

  /* میانگین‌های متحرک — روی خودِ نمودار قیمت */
  if(S.inds.indexOf('ma') !== -1){
    S.mas.forEach((cfg, index) => {
      const len = Math.max(2, parseInt(cfg.n, 10) || 20);
      const data = cfg.t === 'ema' ? emaSeries(bars, len) : smaSeries(bars, len);
      if(!data.length) return;
      const color = cfg.c || MA_PALETTE[index % MA_PALETTE.length];
      const s = mainChart.addLineSeries({
        color:color, lineWidth:1.6, priceLineVisible:false, lastValueVisible:false,
        crosshairMarkerVisible:false });
      s.setData(padSeries(bars, data));
      const map = new Map();
      data.forEach(p => map.set(p.time, p.value));
      overlays['ma' + index] = {series:s, map:map,
        def:{color:color, tag:(cfg.t === 'ema' ? 'EMA' : 'MA') + len}};
    });
  }

  /* رویدادها */
  if(S.events && d.events.length && (S.type === 'candle' || S.type === 'bar')){
    const barTimes = new Set(bars.map(b => b.t));
    const marks = [];
    d.events.forEach(e => {
      let t = e.t;
      if(!barTimes.has(t)){
        const b = bars.find(x => x.t >= e.t);
        if(!b) return;
        t = b.t;
      }
      marks.push({time:t, position:'aboveBar', shape:'circle',
        color: e.type === 'C' ? '#f7c325' : '#2962ff',
        text: e.type});
    });
    marks.sort((a,b) => a.time - b.time);
    try{ mainSeries.setMarkers(marks); }catch(e){}
  }

  const usdLeft = !!overlays['usdprice'];

  const mainMap = new Map();
  bars.forEach(b => mainMap.set(b.t, b.c));
  charts.push({id:'__main', chart:mainChart, el:mainEl, series:mainSeries,
               legend:mainEl.querySelector('.legend'), map:mainMap});

  /* ---------- پنل اندیکاتورها ---------- */
  S.inds.forEach(id => {
    const def = IND_BY_ID[id];
    if(!def || def.pane === 'main' || def.pane === 'volume' || def.pane === 'ma') return;

    const data =
        def.from === 'bars'  ? def.calc(bars)
      : def.from === 'step'  ? stepSeries(bars, def.pts(d), def.scale)
      : def.from === 'stepdiv' ? stepDivSeries(bars, def.pts(d), def.den(d), def.scale)
      : def.from === 'ratio' ? stepSeries(bars, ratioPoints(d, def.ridx), def.scale)
      : seriesFor(def.get, bars, d, def.agg || 'last');
    const empty = !data || (def.kind === 'macd' ? !data.macd.length : !data.length);
    if(empty) return;

    const el = makePane('ind', paneHeight(id));
    addGrip(el);
    const chart = LWC.createChart(el.querySelector('.cv'), baseOptions());
    chart.priceScale('right').applyOptions({scaleMargins:{top:0.16, bottom:0.1}});
    /* اگر نمودار اصلی محور چپ (دلاری) دارد، اینجا هم یک محور چپِ خالی
       باز می‌شود؛ وگرنه پنل اصلی به اندازه‌ی عرض آن محور جابه‌جا می‌شود
       و شمع‌ها با زیرپنل‌ها زیر هم نمی‌افتند. */
    if(usdLeft){
      chart.applyOptions({leftPriceScale:{visible:true, borderColor:theme().border,
        borderVisible:true, minimumWidth:78}});
    }

    let series;
    if(def.kind === 'macd'){
      /* هیستوگرام اول اضافه می‌شود تا زیر خط‌ها بیفتد */
      const T3 = theme();
      const hist = chart.addHistogramSeries({priceLineVisible:false, lastValueVisible:false});
      hist.setData(padSeries(bars, data.hist.map(p => ({
        time:p.time, value:p.value,
        color: p.value >= 0 ? withAlpha(T3.up,.55) : withAlpha(T3.dn,.55)
      }))));
      const sig = chart.addLineSeries({color:'#ff9800', lineWidth:1.4,
        priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false});
      sig.setData(padSeries(bars, data.signal));
      series = chart.addLineSeries({color:'#2962ff', lineWidth:1.6, priceLineVisible:false});
      series.setData(padSeries(bars, data.macd));
      series.createPriceLine({price:0, color:theme().text, lineWidth:1,
        lineStyle:2, axisLabelVisible:false});
      chart.extra = {hist:hist, signal:sig};
    }else if(def.kind === 'hist'){
      series = chart.addHistogramSeries({priceLineVisible:false, lastValueVisible:true});
      const T2 = theme();
      series.setData(padSeries(bars, data.map(p => {
        const up = def.signed === 'zero' ? p.value >= 0 : barUpAt(bars, p.time);
        return {time:p.time, value:p.value,
                color: up ? withAlpha(T2.up,.65) : withAlpha(T2.dn,.65)};
      })));
    }else{
      /* داده‌ی دوره‌ای پله‌ای رسم می‌شود: بین دو گزارش عدد عوض نمی‌شود،
         پس خطِ شیب‌دار تصویر گمراه‌کننده‌ای می‌سازد. */
      series = chart.addLineSeries({color:def.color || '#2962ff', lineWidth:1.7,
        priceLineVisible:false,
        lineType: def.kind === 'step' ? 1 : 0});
      series.setData(padSeries(bars, data));
      if(def.base != null){
        series.createPriceLine({price:def.base, color:theme().text, lineWidth:1,
          lineStyle:2, axisLabelVisible:false});
      }
      /* خطوط راهنما مثل ۳۰ و ۷۰ در RSI. برچسبِ محور خاموش است چون
         خودِ محور همان عددها را دارد و دوتایی نشان دادنش شلوغ می‌کند. */
      (def.bands || []).forEach(v => {
        series.createPriceLine({price:v, color:theme().text, lineWidth:1,
          lineStyle:2, axisLabelVisible:false, title:''});
      });
    }
    series.applyOptions({priceFormat:{type:'custom',
      formatter:v => fmtBy(def.fmt, v), minMove:0.000001}});

    /* محور ثابت برای اندیکاتورهایی مثل RSI که دامنه‌شان معلوم است */
    if(def.fixed){
      chart.priceScale('right').applyOptions({scaleMargins:{top:0.05, bottom:0.05}});
      try{ series.applyOptions({autoscaleInfoProvider: () => ({
        priceRange:{minValue:def.fixed[0], maxValue:def.fixed[1]}})}); }catch(e){}
    }

    const map = new Map();
    (def.kind === 'macd' ? data.macd : data).forEach(p => map.set(p.time, p.value));
    charts.push({id:id, chart:chart, el:el, series:series, ind:def,
                 legend:el.querySelector('.legend'), map:map});
  });

  linkCharts();

  if(keepRange){
    try{ charts[0].chart.timeScale().setVisibleLogicalRange(keepRange); }catch(e){}
  }else{
    applyRange();
  }
  S.shown = S.key;

  alignScales();
  paintLegend(null);
  updateStatus();
  drawInit();
}

/* عرض محور قیمتِ همه‌ی پنل‌ها یکی می‌شود، وگرنه پنلِ اندیکاتور که
   برچسب بلندتری دارد پهن‌تر می‌شود و محور زمانش با نمودار اصلی زیر هم
   نمی‌افتد. دو بار صدا زده می‌شود چون خودِ تغییرِ عرض دوباره چیدمان را
   عوض می‌کند. */
function alignScales(){
  const pass = () => {
    if(charts.length < 2) return;
    /* هر دو محور: راست (ریالی) و چپ (دلاری). اگر یکی‌شان در یک پنل پهن‌تر
       باشد، محور زمانِ همان پنل جابه‌جا می‌شود و ردیف شمع‌ها به هم می‌ریزد. */
    ['right', 'left'].forEach(side => {
      let w = 0;
      charts.forEach(c => {
        try{
          const scale = c.chart.priceScale(side);
          if(side === 'left' && !scale.options().visible) return;
          const x = scale.width();
          if(x > w) w = x;
        }catch(e){}
      });
      if(w <= 0) return;
      charts.forEach(c => {
        try{
          const scale = c.chart.priceScale(side);
          if(side === 'left' && !scale.options().visible) return;
          scale.applyOptions({minimumWidth: Math.ceil(w)});
        }catch(e){}
      });
    });
  };
  requestAnimationFrame(() => { pass(); requestAnimationFrame(pass); });
}

function paneHeight(id){
  const v = parseInt(recall('tv-h-' + id, '132'), 10);
  return (isFinite(v) && v > 60) ? v : 132;
}
function addGrip(el){
  const g = document.createElement('div');
  g.className = 'grip';
  el.appendChild(g);
  let y0 = 0, h0 = 0;
  g.addEventListener('mousedown', e => {
    y0 = e.clientY; h0 = el.offsetHeight;
    document.body.style.cursor = 'row-resize';
    const move = ev => {
      const h = Math.max(70, Math.min(430, h0 + (ev.clientY - y0)));
      el.style.height = h + 'px';
    };
    const up = () => {
      document.body.style.cursor = '';
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      const rec = charts.find(c => c.el === el);
      if(rec) store('tv-h-' + rec.id, String(el.offsetHeight));
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    e.preventDefault();
  });
}

function withAlpha(hex, a){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if(!m) return hex;
  const n = parseInt(m[1], 16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}
function barUp(bars, i){
  const b = bars[i];
  if(!b) return true;
  return i > 0 ? b.c >= bars[i-1].c : b.c >= b.o;
}
const BAR_INDEX = new Map();
function barUpAt(bars, t){
  const i = BAR_INDEX.get(t);
  return i == null ? true : barUp(bars, i);
}

function linkCharts(){
  // محور زمان فقط زیر آخرین پنل — مثل TradingView؛ وگرنه بین هر دو پنل
  // یک نوار تاریخ تکراری می‌نشیند و ارتفاع مفید نمودار را می‌خورد.
  charts.forEach((rec, i) => {
    rec.chart.timeScale().applyOptions({visible: i === charts.length - 1});
  });
  charts.forEach(rec => {
    rec.chart.timeScale().subscribeVisibleLogicalRangeChange(r => {
      if(syncing || !r) return;
      syncing = true;
      charts.forEach(o => { if(o !== rec) o.chart.timeScale().setVisibleLogicalRange(r); });
      syncing = false;
      drawRedraw();
    });
    rec.chart.subscribeCrosshairMove(param => {
      if(!param || param.time == null){ paintLegend(null); clearOthers(rec); return; }
      paintLegend(param.time);
      // خط عمودیِ کراس‌هر روی همه‌ی پنل‌ها هم‌زمان حرکت کند.
      charts.forEach(o => {
        if(o === rec) return;
        const price = valueAt(o, param.time);
        try{
          if(price == null) o.chart.clearCrosshairPosition();
          else o.chart.setCrosshairPosition(price, param.time, o.series);
        }catch(e){}
      });
    });
  });
}
function valueAt(rec, time){
  const map = rec.map;
  if(!map) return null;
  const v = map.get(time);
  return v == null ? null : v;
}
function clearOthers(rec){
  charts.forEach(o => { if(o !== rec){ try{ o.chart.clearCrosshairPosition(); }catch(e){} } });
}

/* =====================================================================
   راهنما (legend)
   ===================================================================== */
function paintLegend(time){
  const d = S.data, bars = S.bars;
  if(!d || !bars || !bars.length) return;

  let idx = bars.length - 1;
  if(time != null){
    let lo = 0, hi = bars.length - 1;
    while(lo < hi){ const mid = (lo+hi)>>1; if(bars[mid].t < time) lo = mid+1; else hi = mid; }
    idx = lo;
    if(bars[idx].t !== time && idx > 0 && Math.abs(bars[idx-1].t - time) < Math.abs(bars[idx].t - time)) idx--;
  }
  const b = bars[idx];
  const prev = idx > 0 ? bars[idx-1] : null;
  const chg = prev ? (b.c/prev.c - 1)*100 : null;
  const cls = chg == null ? 'fl' : (chg > 0 ? 'up' : (chg < 0 ? 'dn' : 'fl'));

  const main = charts[0];
  if(main){
    let html = '<span class="ttl">' + d.sym +
      '<em> · ' + (d.market || d.board || '') + '</em></span>';
    html += '<i>باز</i><b class="' + cls + '">' + num(b.o) + '</b>';
    html += '<i>بیشترین</i><b class="' + cls + '">' + num(b.h) + '</b>';
    html += '<i>کمترین</i><b class="' + cls + '">' + num(b.l) + '</b>';
    html += '<i>آخرین</i><b class="' + cls + '">' + num(b.c) + '</b>';
    if(chg != null) html += '<b class="' + cls + '">' + pct(chg) + '</b>';
    Object.keys(overlays).forEach(id => {
      const rec = overlays[id];
      const v = rec.map.get(b.t);
      html += '<i style="color:' + rec.def.color + '">' + (rec.def.tag || id) +
              '</i><b>' + (v == null ? '—'
                : (rec.def.fmt ? fmtBy(rec.def.fmt, v) : num(Math.round(v)))) + '</b>';
    });
    if(S.inds.indexOf('volume') !== -1){
      const vv = sumAt(d.v, b);
      if(vv != null) html += '<i>حجم</i><b>' + compact(vv) + '</b>';
    }
    main.legend.innerHTML = html;
  }

  for(let i=1;i<charts.length;i++){
    const rec = charts[i], def = rec.ind;
    /* مقدار از همان نقشه‌ای خوانده می‌شود که هنگام رسم ساخته شد؛ هم
       اندیکاتورهای داده‌ای و هم محاسباتی (RSI و MACD) را پوشش می‌دهد. */
    const v = rec.map ? rec.map.get(b.t) : null;
    rec.legend.innerHTML =
      '<span class="pill"><i>' + def.name + '</i><b>' + fmtBy(def.fmt, v) + '</b>' +
      '<button class="x" data-drop="' + def.id + '" title="حذف">×</button></span>';
  }

  paintDataWindow(b, idx);
}
function sumAt(arr, b){
  if(!arr) return null;
  if(!b.ii || b.ii.length < 2) return arr[b.i];
  let s = 0, any = false;
  for(const i of b.ii){ if(arr[i] != null){ s += arr[i]; any = true; } }
  return any ? s : null;
}

function paintDataWindow(b, idx){
  const box = document.getElementById('dwBody');
  if(!box || document.getElementById('sideData').hidden) return;
  const d = S.data;
  const rows = [
    ['تاریخ', jalaliShort(b.t)],
    ['باز', num(b.o)], ['بیشترین', num(b.h)], ['کمترین', num(b.l)],
    ['آخرین معامله', num(b.c)], ['قیمت پایانی', num(b.w)],
    ['حجم', compact(sumAt(d.v, b))],
    ['ارزش معاملات', money(sumAt(d.q, b))],
    ['تعداد معاملات', num(sumAt(d.nt, b))],
    ['ارزش بازار', money(d.m[b.i])],
    ['P/E', fmtBy('r2', d.pe && d.pe[b.i])],
    ['P/S', fmtBy('r2', d.ps && d.ps[b.i])],
    ['P/B', fmtBy('r2', d.pb && d.pb[b.i])],
    ['P/D', fmtBy('r2', d.pd && d.pd[b.i])],
    ['سهام شناور', fmtBy('pct1', d.ffp && d.ffp[b.i])],
    ['قدرت خریدار حقیقی', fmtBy('r2', d.bp && d.bp[b.i])],
    ['خالص ورود پول حقیقی', money(sumAt(d.ni, b))],
    ['سرانه خرید حقیقی', money(d.pp && d.pp[b.i])],
    ['سرانه فروش حقیقی', money(d.pq && d.pq[b.i])],
    ['ضریب تعدیل', d.k[b.i] == null ? '—' : d.k[b.i].toFixed(5)],
    ['تعداد سهام', compact(d.sh[b.i])]
  ];
  box.innerHTML = rows.map(r =>
    '<div class="r"><b>' + r[0] + '</b><span>' + r[1] + '</span></div>').join('');
}


/* =====================================================================
   ابزار رسم — خط روند، خط افقی و خط عمودی روی نمودار قیمت

   خط‌ها بر اساس «زمانِ میله» و «قیمت» ذخیره می‌شوند، نه پیکسل؛ برای
   همین با زوم و اسکرول و عوض‌شدن بازه سر جای خودشان می‌مانند. برای هر
   نماد جدا در localStorage ذخیره می‌شوند.
   ===================================================================== */
const DRAW_TOOLS = [
  {id:'cursor', title:'مکان‌نما (Esc)',
   icon:'<path d="M5 3l13 7.5-5.5 1.5L10 18z"/>'},
  {id:'trend', title:'خط روند',
   icon:'<path d="M4 19L20 5"/><circle cx="4.5" cy="18.5" r="1.8"/><circle cx="19.5" cy="5.5" r="1.8"/>'},
  {id:'hline', title:'خط افقی',
   icon:'<path d="M3 12h18"/><circle cx="12" cy="12" r="1.8"/>'},
  {id:'vline', title:'خط عمودی',
   icon:'<path d="M12 3v18"/><circle cx="12" cy="12" r="1.8"/>'},
  {id:'measure', title:'اندازه‌گیری — درصد و مقدار تغییر بین دو نقطه',
   icon:'<path d="M4 20h16"/><path d="M7 20v-4"/><path d="M17 20v-4"/>' +
        '<path d="M12 3v13"/><path d="M8.5 6.5L12 3l3.5 3.5"/>'}
];
const DRAW_COLOR = '#2962ff';
/* رنگ ابزار اندازه‌گیری: سبز برای رشد، قرمز برای کاهش — مثل TradingView */
const MEASURE_UP = '#089981';
const MEASURE_DOWN = '#f23645';

let drawMode = 'cursor';
let drawItems = [];
let drawPending = null;
let drawSvg = null;
let drawSel = -1;

function drawKey(){ return 'tv-draw2-' + (S.data ? S.data.sym : '-'); }

/* ضریب تعدیلِ همان روز. قیمتِ تعدیل‌شده = قیمت خام × ضریب. */
function coefAt(time){
  const d = S.data;
  if(!d || !d.k) return 1;
  const i = indexOfTime(time);
  const bar = (i == null || !S.bars) ? null : S.bars[i];
  const k = bar ? d.k[bar.i] : null;
  return (k == null || !isFinite(k) || k <= 0) ? 1 : k;
}
/* آنچه کاربر روی نمودار می‌بیند ↔ آنچه ذخیره می‌شود.
   با این کار وقتی بین «تعدیل‌شده» و «تعدیل‌نشده» جابه‌جا می‌شویم،
   خط‌ها هم دقیقاً مثل خود نمودار جابه‌جا می‌شوند. */
function toRaw(price, time){ return S.adj === 1 ? price / coefAt(time) : price; }
function toShown(price, time){ return S.adj === 1 ? price * coefAt(time) : price; }

function drawLoad(){
  try{
    const j = JSON.parse(recall(drawKey(), '[]'));
    drawItems = Array.isArray(j) ? j : [];
  }catch(e){ drawItems = []; }
  drawSel = -1;
}
function drawSave(){ store(drawKey(), JSON.stringify(drawItems)); }

function drawBar(){
  const host = document.getElementById('drawBar');
  if(!host || host.dataset.ready) return;
  host.dataset.ready = '1';
  DRAW_TOOLS.forEach(tool => {
    const b = document.createElement('button');
    b.type = 'button'; b.title = tool.title; b.dataset.tool = tool.id;
    b.innerHTML = '<svg viewBox="0 0 24 24">' + tool.icon + '</svg>';
    b.addEventListener('click', () => setDrawMode(tool.id));
    host.appendChild(b);
  });
  const sep = document.createElement('div');
  sep.className = 'sep';
  host.appendChild(sep);

  const del = document.createElement('button');
  del.type = 'button'; del.title = 'پاک کردن همه‌ی خط‌ها';
  del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>';
  del.addEventListener('click', () => {
    if(!drawItems.length) return;
    drawItems = []; drawSel = -1; drawSave(); drawRedraw();
  });
  host.appendChild(del);
}

function setDrawMode(mode){
  drawMode = mode;
  drawPending = null;
  document.querySelectorAll('#drawBar button[data-tool]').forEach(b => {
    b.classList.toggle('on', b.dataset.tool === mode);
  });
  if(drawSvg) drawSvg.classList.toggle('draw-on', mode !== 'cursor');
  drawRedraw();
}
function drawCancel(){ if(drawMode !== 'cursor') setDrawMode('cursor'); }

/* ---- تبدیل مختصات ---- */
function xOfIndex(i){
  try{ const c = mainChart.timeScale().logicalToCoordinate(i); return c == null ? null : c; }
  catch(e){ return null; }
}
function yOfPrice(price){
  try{ const c = mainSeries.priceToCoordinate(price); return c == null ? null : c; }
  catch(e){ return null; }
}
function indexOfX(x){
  try{
    const l = mainChart.timeScale().coordinateToLogical(x);
    return l == null ? null : Math.round(l);
  }catch(e){ return null; }
}
function priceOfY(y){
  try{ const v = mainSeries.coordinateToPrice(y); return v == null ? null : v; }
  catch(e){ return null; }
}
/* زمانِ ذخیره‌شده به شماره‌ی میله — اگر دقیقاً همان میله نبود (مثلاً
   بازه از روزانه به هفتگی عوض شده)، نزدیک‌ترین میله. */
function indexOfTime(time){
  const exact = BAR_INDEX.get(time);
  if(exact != null) return exact;
  const bars = S.bars;
  if(!bars || !bars.length) return null;
  let lo = 0, hi = bars.length - 1;
  while(lo < hi){ const mid = (lo + hi) >> 1; if(bars[mid].t < time) lo = mid + 1; else hi = mid; }
  return lo;
}
function timeOfIndex(i){
  const bars = S.bars;
  if(!bars || !bars.length) return null;
  const k = Math.max(0, Math.min(bars.length - 1, i));
  return bars[k].t;
}

/* ---- ساخت لایه و رویدادها ---- */
function drawInit(){
  drawBar();
  drawLoad();
  const pane = document.querySelector('.pane.main');
  if(!pane || !mainChart || !mainSeries){ drawSvg = null; return; }

  drawSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  drawSvg.setAttribute('class', 'draw' + (drawMode !== 'cursor' ? ' draw-on' : ''));
  pane.appendChild(drawSvg);

  drawSvg.addEventListener('mousedown', onDrawDown);
  drawSvg.addEventListener('mousemove', onDrawMove);

  if(window.ResizeObserver && !pane.__ro){
    pane.__ro = new ResizeObserver(() => drawRedraw());
    pane.__ro.observe(pane);
  }
  setDrawMode(drawMode);
}

function onDrawDown(e){
  if(drawMode === 'cursor') return;
  const box = drawSvg.getBoundingClientRect();
  const i = indexOfX(e.clientX - box.left);
  const price = priceOfY(e.clientY - box.top);
  if(i == null || price == null) return;
  const time = timeOfIndex(i);

  const raw = toRaw(price, time);
  if(drawMode === 'hline' || drawMode === 'vline'){
    drawItems.push({type:drawMode, t1:time, p1:raw});
    drawSave(); setDrawMode('cursor'); drawRedraw();
  }else if(!drawPending){
    drawPending = {type:drawMode, t1:time, p1:raw, t2:time, p2:raw};
    drawRedraw();
  }else{
    drawPending.t2 = time; drawPending.p2 = raw;
    drawItems.push(drawPending); drawPending = null;
    drawSave(); setDrawMode('cursor'); drawRedraw();
  }
  e.preventDefault(); e.stopPropagation();
}

function onDrawMove(e){
  if(!drawPending) return;
  const box = drawSvg.getBoundingClientRect();
  const i = indexOfX(e.clientX - box.left);
  const price = priceOfY(e.clientY - box.top);
  if(i == null || price == null) return;
  drawPending.t2 = timeOfIndex(i);
  drawPending.p2 = toRaw(price, drawPending.t2);
  drawRedraw();
}

/* ---- ابزار اندازه‌گیری ----
   بین دو نقطه‌ی انتخابی: درصد تغییر، مقدار تغییر، تعداد میله‌ی معاملاتی و
   تعداد روز تقویمی. قیمت‌ها همان چیزی‌اند که روی نمودار دیده می‌شوند، پس
   با جابه‌جایی بین «تعدیل‌شده» و «تعدیل‌نشده» عدد هم درست عوض می‌شود. */
function measureStats(item){
  const p1 = toShown(item.p1, item.t1);
  const p2 = toShown(item.p2, item.t2);
  const i1 = indexOfTime(item.t1), i2 = indexOfTime(item.t2);

  const diff = p2 - p1;
  const pct = (p1 && isFinite(p1) && p1 !== 0)
    ? diff / Math.abs(p1) * 100 : null;
  const bars = (i1 == null || i2 == null) ? null : Math.abs(i2 - i1);
  const days = Math.round(Math.abs((item.t2 - item.t1) / 86400));

  return {p1:p1, p2:p2, diff:diff, pct:pct, bars:bars, days:days};
}

function measureLines(st){
  const dec = Math.abs(st.diff) >= 100 ? 0 : 2;
  const sign = st.diff >= 0 ? '+' : '';
  const head = (st.pct == null ? '—' : sign + st.pct.toFixed(2) + '%');
  const tail = sign + num(st.diff, dec)
    + (st.bars == null ? '' : '  ·  ' + num(st.bars) + ' میله')
    + '  ·  ' + num(st.days) + ' روز';
  return [head, tail];
}

function measureShape(item, index, preview, x1, y1, x2, y2, w, h){
  const st = measureStats(item);
  const up = st.diff >= 0;
  const color = up ? MEASURE_UP : MEASURE_DOWN;

  const left = Math.min(x1, x2), right = Math.max(x1, x2);
  const top = Math.min(y1, y2), bottom = Math.max(y1, y2);
  const boxW = Math.max(1, right - left), boxH = Math.max(1, bottom - top);
  const cx = (left + right) / 2;

  const out = [];

  /* کادر نیمه‌شفاف بین دو نقطه */
  out.push('<rect x="' + left + '" y="' + top + '" width="' + boxW +
           '" height="' + boxH + '" fill="' + color + '" fill-opacity=".13"' +
           ' stroke="' + color + '" stroke-opacity=".5" stroke-width="1"/>');

  /* پیکان عمودی از نقطه‌ی اول به نقطه‌ی دوم */
  out.push('<path class="hit" d="M ' + cx + ' ' + y1 + ' L ' + cx + ' ' + y2 +
           '" data-i="' + index + '"/>');
  out.push('<path d="M ' + cx + ' ' + y1 + ' L ' + cx + ' ' + y2 +
           '" data-i="' + index + '" stroke="' + color +
           '" stroke-width="1.7" fill="none"' +
           (preview ? ' stroke-dasharray="4 3"' : '') + '/>');

  /* سرپیکان، دستی کشیده می‌شود تا به defs و id نیاز نباشد */
  const dir = (y2 >= y1) ? 1 : -1;
  out.push('<path d="M ' + cx + ' ' + y2 + ' L ' + (cx - 5) + ' ' +
           (y2 - dir * 9) + ' L ' + (cx + 5) + ' ' + (y2 - dir * 9) +
           ' Z" fill="' + color + '"/>');

  /* برچسب: درصد در خط اول، جزئیات در خط دوم */
  const lines = measureLines(st);
  const charW = 6.4;
  const labelW = Math.max(
    lines[0].length * 7.6,
    lines[1].length * charW
  ) + 18;
  const labelH = 34;

  let lx = cx - labelW / 2;
  lx = Math.max(4, Math.min(w - labelW - 4, lx));

  /* برچسب بیرون کادر می‌نشیند: اگر نقطه‌ی دوم پایین‌تر است، زیر کادر */
  let ly = dir > 0 ? (bottom + 8) : (top - labelH - 8);
  if(ly + labelH > h - 4) ly = top - labelH - 8;
  if(ly < 4) ly = bottom + 8;
  ly = Math.max(4, Math.min(h - labelH - 4, ly));

  out.push('<rect x="' + lx + '" y="' + ly + '" width="' + labelW +
           '" height="' + labelH + '" rx="4" fill="' + color +
           '" fill-opacity=".95"/>');
  out.push('<text x="' + (lx + labelW / 2) + '" y="' + (ly + 14) +
           '" text-anchor="middle" fill="#fff" font-size="12.5"' +
           ' font-weight="600" style="pointer-events:none">' +
           lines[0] + '</text>');
  out.push('<text x="' + (lx + labelW / 2) + '" y="' + (ly + 27) +
           '" text-anchor="middle" fill="#fff" fill-opacity=".92"' +
           ' font-size="10.5" style="pointer-events:none">' +
           lines[1] + '</text>');

  return out.join('');
}

/* ---- کشیدن ---- */
function drawRedraw(){
  if(!drawSvg || !mainChart || !mainSeries) return;
  const pane = drawSvg.parentNode;
  const w = pane.clientWidth, h = pane.clientHeight;
  drawSvg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

  const parts = [];
  const all = drawPending ? drawItems.concat([drawPending]) : drawItems;

  all.forEach((item, index) => {
    const preview = drawPending && index === all.length - 1 && item === drawPending;
    const x1 = xOfIndex(indexOfTime(item.t1));
    const y1 = yOfPrice(toShown(item.p1, item.t1));
    if(x1 == null || y1 == null) return;

    if(item.type === 'measure'){
      const mx2 = xOfIndex(indexOfTime(item.t2));
      const my2 = yOfPrice(toShown(item.p2, item.t2));
      if(mx2 == null || my2 == null) return;
      parts.push(measureShape(item, index, preview, x1, y1, mx2, my2, w, h));
      return;
    }

    let d = null;
    if(item.type === 'hline')      d = 'M 0 ' + y1 + ' L ' + w + ' ' + y1;
    else if(item.type === 'vline') d = 'M ' + x1 + ' 0 L ' + x1 + ' ' + h;
    else{
      const x2 = xOfIndex(indexOfTime(item.t2));
      const y2 = yOfPrice(toShown(item.p2, item.t2));
      if(x2 == null || y2 == null) return;
      d = 'M ' + x1 + ' ' + y1 + ' L ' + x2 + ' ' + y2;
    }

    const on = !preview && index === drawSel;
    /* یک خط نامرئیِ ضخیم زیر خط اصلی، تا گرفتنش با موس راحت باشد */
    parts.push('<path class="hit" d="' + d + '" data-i="' + index + '"/>');
    parts.push('<path d="' + d + '" data-i="' + index + '" stroke="' + DRAW_COLOR +
               '" stroke-width="' + (on ? 2.4 : 1.6) + '" fill="none"' +
               (preview ? ' stroke-dasharray="4 3" opacity=".8"' : '') +
               (on ? ' class="sel"' : '') + '/>');

    if(item.type === 'trend' && !preview){
      const x2 = xOfIndex(indexOfTime(item.t2)),
            y2 = yOfPrice(toShown(item.p2, item.t2));
      if(x2 != null && y2 != null){
        parts.push('<circle cx="' + x1 + '" cy="' + y1 + '" r="3.5" fill="' + DRAW_COLOR + '"/>');
        parts.push('<circle cx="' + x2 + '" cy="' + y2 + '" r="3.5" fill="' + DRAW_COLOR + '"/>');
      }
    }
  });

  drawSvg.innerHTML = parts.join('');
  drawSvg.querySelectorAll('[data-i]').forEach(el => {
    el.addEventListener('mousedown', ev => {
      if(drawMode !== 'cursor') return;
      drawSel = parseInt(el.dataset.i, 10);
      drawRedraw();
      ev.stopPropagation();
    });
  });
}

/* =====================================================================
   بازه
   ===================================================================== */
function applyRange(){
  if(!charts.length || !S.bars) return;
  const n = S.bars.length;
  const want = S.range > 0 ? Math.min(S.range, n) : n;
  const from = n - want;
  try{
    charts[0].chart.timeScale().setVisibleLogicalRange({from:from - 0.5, to:n + 4});
  }catch(e){}
}

function updateStatus(){
  const d = S.data;
  if(!d) return;
  const last = S.bars && S.bars.length ? S.bars[S.bars.length-1] : null;
  document.getElementById('statusText').textContent =
    d.sym + ' · ' + (d.name || '') + ' · ' + (d.ind || '') +
    (last ? ' · آخرین داده: ' + jalaliShort(last.t) : '') +
    ' · ' + num(d.n) + ' روز معاملاتی';
  document.getElementById('metaTag').textContent =
    (d.market ? d.market + ' · ' : '') + (d.board || '');
  document.getElementById('symBtnText').textContent = d.sym;
  document.title = d.sym + ' — تکنیکال';
}

/* =====================================================================
   فهرست نمادها
   ===================================================================== */
let ROWS = [];
function paintWatch(filter){
  const box = document.getElementById('wlBody');
  const q = (filter || '').trim();
  const list = q ? ROWS.filter(r => match(r, q)) : ROWS;
  document.getElementById('wlCount').textContent = num(list.length) + ' نماد';
  if(!list.length){ box.innerHTML = '<div class="empty">نمادی پیدا نشد</div>'; return; }
  box.innerHTML = list.slice(0, 600).map(r => {
    const cls = r.ch == null ? 'fl' : (r.ch > 0 ? 'up' : (r.ch < 0 ? 'dn' : 'fl'));
    return '<div class="wrow' + (r.k === S.key ? ' on' : '') + '" data-k="' + r.k + '">' +
      '<span class="s">' + r.s + '<span class="g">' + (r.n || r.g || '') + '</span></span>' +
      '<span class="p">' + (r.p == null ? '—' : num(r.p)) + '</span>' +
      '<span class="c ' + cls + '">' + (r.ch == null ? '—' : pct(r.ch)) + '</span></div>';
  }).join('');
}
function match(r, q){
  return (r.s && r.s.indexOf(q) !== -1) ||
         (r.n && r.n.indexOf(q) !== -1) ||
         (r.g && r.g.indexOf(q) !== -1);
}

function paintSymModal(filter){
  const box = document.getElementById('symList');
  const q = (filter || '').trim();
  const list = (q ? ROWS.filter(r => match(r, q)) : ROWS).slice(0, 300);
  if(!list.length){ box.innerHTML = '<div class="empty">نمادی پیدا نشد</div>'; return; }
  box.innerHTML = list.map((r,i) =>
    '<div class="mrow' + (i===0?' hot':'') + '" data-k="' + r.k + '">' +
    '<span class="s">' + r.s + '</span>' +
    '<span class="n">' + (r.n || '') + '</span>' +
    '<span class="m">' + (r.g || '') + '</span></div>').join('');
}

function paintMaModal(){
  const box = document.getElementById('maBody');
  if(!S.mas.length){
    box.innerHTML = '<div class="empty">هنوز میانگینی اضافه نشده است.</div>';
    return;
  }
  box.innerHTML = S.mas.map((cfg, i) =>
    '<div class="marow" data-i="' + i + '">' +
    '<span class="lbl">نوع</span>' +
    '<select data-f="t">' +
      Object.keys(MA_KINDS).map(k => '<option value="' + k + '"' +
        (cfg.t === k ? ' selected' : '') + '>' + MA_KINDS[k] + '</option>').join('') +
    '</select>' +
    '<span class="lbl">دوره</span>' +
    '<input type="number" data-f="n" min="2" max="500" value="' + cfg.n + '">' +
    '<span class="lbl">رنگ</span>' +
    '<input type="color" data-f="c" value="' + (cfg.c || '#f7c325') + '">' +
    '<button class="rm" data-rm="' + i + '" title="حذف">×</button>' +
    '</div>').join('');
}

function maCommit(){
  store('tv-mas2', JSON.stringify(S.mas));
  if(S.inds.indexOf('ma') === -1 && S.mas.length){
    S.inds.push('ma'); store('tv-inds', JSON.stringify(S.inds));
  }
  renderAll();
}

function paintIndModal(filter){
  const box = document.getElementById('indList');
  const d = S.data;
  const q = (filter || '').trim();
  const groups = {};
  IND.forEach(def => {
    /* اندیکاتورهای مخصوص شاخص کل روی نمادهای عادی اصلاً فهرست نمی‌شوند */
    if(def.ix && !(d && d.ix)) return;
    if(q && def.name.indexOf(q) === -1 && def.id.indexOf(q) === -1) return;
    let has;
    if(def.instanced || def.pane === 'volume'){
      has = true;
    }else if(def.from === 'bars'){
      /* اندیکاتور محاسباتی: تا وقتی میله‌ی کافی باشد، داده دارد. */
      has = !!(S.bars && S.bars.length > 20);
    }else if(def.from === 'step' || def.from === 'stepdiv'){
      const pts = d ? def.pts(d) : null;
      has = !!(pts && pts.length) &&
            (def.from !== 'stepdiv' || !!(d && def.den(d)));
    }else if(def.from === 'ratio'){
      const pts = d ? ratioPoints(d, def.ridx) : null;
      has = !!(pts && pts.length);
    }else{
      const arr = d ? def.get(d) : null;
      has = !!(arr && arr.some(x => x != null));
    }
    (groups[def.grp] = groups[def.grp] || []).push({def:def, has:has});
  });
  let html = '';
  Object.keys(groups).forEach(g => {
    html += '<div class="gh">' + g + '</div>';
    groups[g].forEach(x => {
      const on = S.inds.indexOf(x.def.id) !== -1;
      const swatch = x.def.color
        ? '<span class="sw" style="background:' + x.def.color + '"></span>' : '';
      html += '<div class="mrow' + (on?' sel':'') + (x.has?'':' dis') +
        '" data-ind="' + x.def.id + '">' +
        '<span class="ck">' + (on?'✓':'') + '</span>' +
        '<span class="n" style="color:var(--ink);flex:1">' + x.def.name + '</span>' +
        swatch +
        '<span class="m">' + (x.has ? (x.def.desc || '') : 'داده ندارد') + '</span></div>';
    });
  });
  box.innerHTML = html || '<div class="empty">موردی پیدا نشد</div>';
}


/* =====================================================================
   بارگذاری نماد
   ===================================================================== */
function openSymbol(key){
  const box = document.getElementById('charts');
  const old = document.getElementById('loading');
  if(old) old.hidden = false;
  else box.insertAdjacentHTML('beforeend', '<div class="loading" id="loading">در حال بارگذاری…</div>');

  TECH.load(key, function(d){
    const l = document.getElementById('loading');
    if(!d){
      if(l){ l.hidden = false; l.textContent = 'داده‌ی این نماد خوانده نشد.'; }
      return;
    }
    S.key = key; S.data = d;
    store('tv-sym', key);
    if(l) l.hidden = true;
    renderAll();
    paintWatch(document.getElementById('wlSearch').value);
    if(location.hash.slice(1) !== d.sym) history.replaceState(null,'','#'+encodeURIComponent(d.sym));
  });
}

/* =====================================================================
   رویدادها
   ===================================================================== */
function segWire(id, key, apply){
  const seg = document.getElementById(id);
  seg.addEventListener('click', e => {
    const b = e.target.closest('button');
    if(!b) return;
    [].forEach.call(seg.querySelectorAll('button'),
      x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    apply(b.dataset[key]);
  });
}
function segSet(id, key, value){
  const seg = document.getElementById(id);
  [].forEach.call(seg.querySelectorAll('button'),
    x => x.setAttribute('aria-pressed', x.dataset[key] === String(value) ? 'true' : 'false'));
}

function pickWire(id, apply){
  const el = document.getElementById(id);
  if(el) el.addEventListener('change', () => apply(el.value));
}
function pickSet(id, value){
  const el = document.getElementById(id);
  if(el) el.value = String(value);
}
pickWire('tfPick', v => { S.tf = v; store('tv-tf', v); renderAll(); });
pickWire('typePick', v => { S.type = v; store('tv-type', v); renderAll(); });
pickWire('adjPick', v => { S.adj = v === '1' ? 1 : 0; store('tv-adj', String(S.adj)); renderAll(); });
segWire('rangeSeg','r', v => { S.range = parseInt(v,10)||0; store('tv-range', v); applyRange(); });
segWire('scaleSeg','log', v => {
  S.log = v === '1';
  store('tv-log', v);
  if(mainChart) mainChart.priceScale('right').applyOptions({
    mode: S.log ? LWC.PriceScaleMode.Logarithmic : LWC.PriceScaleMode.Normal});
});

document.getElementById('evBtn').addEventListener('click', function(){
  S.events = !S.events;
  this.classList.toggle('on', S.events);
  store('tv-ev', S.events ? '1' : '0');
  renderAll();
});

document.getElementById('usdBtn').addEventListener('click', function(){
  S.usd = !S.usd;
  this.classList.toggle('on', S.usd);
  store('tv-usd', S.usd ? '1' : '0');
  renderAll();
});

document.getElementById('themeBtn').addEventListener('click', () => {
  const now = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', now);
  store('tv-theme', now);
  renderAll();
});

function openOv(id){
  document.getElementById(id).classList.add('on');
  const input = document.querySelector('#' + id + ' input');
  if(input){ input.value = ''; input.focus(); }
}
function closeOv(id){ document.getElementById(id).classList.remove('on'); }
document.addEventListener('click', e => {
  const c = e.target.closest('[data-close]');
  if(c) closeOv(c.dataset.close);
  if(e.target.classList && e.target.classList.contains('ov')) e.target.classList.remove('on');
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ ['symOv','indOv','maOv'].forEach(closeOv); drawCancel(); }
  if((e.key === 'Delete' || e.key === 'Backspace') && drawSel >= 0
     && !/input|textarea/i.test(e.target.tagName)){
    drawItems.splice(drawSel, 1); drawSel = -1; drawSave(); drawRedraw();
    e.preventDefault();
  }
  if(e.key === '/' && !/input|textarea/i.test(e.target.tagName)){
    e.preventDefault(); openOv('symOv'); paintSymModal('');
  }
});

document.getElementById('symBtn').addEventListener('click', () => { openOv('symOv'); paintSymModal(''); });
document.getElementById('symSearch').addEventListener('input', e => paintSymModal(e.target.value));
document.getElementById('symSearch').addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    const first = document.querySelector('#symList .mrow');
    if(first){ closeOv('symOv'); openSymbol(first.dataset.k); }
  }
});
document.getElementById('symList').addEventListener('click', e => {
  const row = e.target.closest('.mrow');
  if(!row) return;
  closeOv('symOv'); openSymbol(row.dataset.k);
});

document.getElementById('indBtn').addEventListener('click', () => { openOv('indOv'); paintIndModal(''); });
document.getElementById('railInd').addEventListener('click', () => { openOv('indOv'); paintIndModal(''); });
document.getElementById('indSearch').addEventListener('input', e => paintIndModal(e.target.value));
document.getElementById('maBody').addEventListener('input', e => {
  const row = e.target.closest('.marow');
  if(!row) return;
  const cfg = S.mas[parseInt(row.dataset.i, 10)];
  if(!cfg) return;
  const field = e.target.dataset.f;
  if(field === 'n') cfg.n = Math.max(2, parseInt(e.target.value, 10) || 20);
  else if(field === 't') cfg.t = e.target.value;
  else if(field === 'c') cfg.c = e.target.value;
  maCommit();
});
document.getElementById('maBody').addEventListener('click', e => {
  const b = e.target.closest('[data-rm]');
  if(!b) return;
  S.mas.splice(parseInt(b.dataset.rm, 10), 1);
  paintMaModal(); maCommit();
});
document.getElementById('maAdd').addEventListener('click', () => {
  S.mas.push({n:[20,50,100,200][S.mas.length % 4], t:'sma',
              c:MA_PALETTE[S.mas.length % MA_PALETTE.length]});
  paintMaModal(); maCommit();
});

document.getElementById('indList').addEventListener('click', e => {
  const row = e.target.closest('.mrow');
  if(!row || row.classList.contains('dis')) return;
  const id = row.dataset.ind;
  /* میانگین متحرک پنجره‌ی تنظیم خودش را دارد */
  if(id === 'ma'){
    closeOv('indOv');
    if(!S.mas.length) S.mas.push({n:20, t:'sma', c:MA_PALETTE[0]});
    openOv('maOv'); paintMaModal(); maCommit();
    return;
  }
  const at = S.inds.indexOf(id);
  if(at === -1) S.inds.push(id); else S.inds.splice(at, 1);
  store('tv-inds', JSON.stringify(S.inds));
  paintIndModal(document.getElementById('indSearch').value);
  renderAll();
});


document.getElementById('charts').addEventListener('click', e => {
  const x = e.target.closest('[data-drop]');
  if(!x) return;
  const at = S.inds.indexOf(x.dataset.drop);
  if(at !== -1){ S.inds.splice(at,1); store('tv-inds', JSON.stringify(S.inds)); renderAll(); }
});

document.getElementById('wlSearch').addEventListener('input', e => paintWatch(e.target.value));
document.getElementById('wlBody').addEventListener('click', e => {
  const row = e.target.closest('.wrow');
  if(row) openSymbol(row.dataset.k);
});

function railToggle(btnId, panelId){
  document.getElementById(btnId).addEventListener('click', function(){
    const p = document.getElementById(panelId);
    p.hidden = !p.hidden;
    this.classList.toggle('on', !p.hidden);
    if(!p.hidden && panelId === 'sideData' && S.bars && S.bars.length){
      paintLegend(null);
    }
  });
}
railToggle('railWatch','sideWatch');
railToggle('railData','sideData');

window.addEventListener('hashchange', () => {
  const want = decodeURIComponent(location.hash.slice(1));
  const row = ROWS.find(r => r.s === want);
  if(row && row.k !== S.key) openSymbol(row.k);
});

/* =====================================================================
   شروع
   ===================================================================== */
pickSet('tfPick', S.tf);
pickSet('typePick', S.type);
pickSet('adjPick', S.adj);
segSet('rangeSeg','r',S.range);
segSet('scaleSeg','log',S.log ? 1 : 0);
document.getElementById('evBtn').classList.toggle('on', S.events);
document.getElementById('usdBtn').classList.toggle('on', S.usd);

TECH.whenIndex(function(rows){
  ROWS = rows || [];
  paintWatch('');
  let key = null;
  const want = decodeURIComponent(location.hash.slice(1));
  if(want){ const r = ROWS.find(x => x.s === want); if(r) key = r.k; }
  if(!key){ const saved = recall('tv-sym',''); if(ROWS.some(x => x.k === saved)) key = saved; }
  if(!key) key = DEFAULT_KEY || (ROWS[0] && ROWS[0].k);
  if(key) openSymbol(key);
  else document.getElementById('loading').textContent = 'داده‌ای برای نمایش نیست.';
});

(function(){
  const el = document.createElement('script');
  el.src = DATA_DIR + 'index.js?v=' + BUILD_ID;
  el.onerror = () => {
    document.getElementById('loading').textContent =
      'پوشه‌ی technical_data کنار این فایل پیدا نشد.';
  };
  document.head.appendChild(el);
})();
</script>
